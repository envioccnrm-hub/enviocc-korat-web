<!-- ===== สคริปต์หน้า Login (เชื่อม Google Apps Script) ===== -->
<script>
(function () {
  'use strict';

  var fullData = [];   // [{district, type, hospital}] จากชีต "Login รายชื่อผู้ใช้งาน"

  var $ = function (id) { return document.getElementById(id); };

  /* ---------- ปุ่มดู/ซ่อนรหัสผ่าน ---------- */
  window.togglePassword = function () {
    var el = $('password');
    el.type = el.type === 'password' ? 'text' : 'password';
  };

  /* ---------- เติมตัวเลือกใน dropdown ---------- */
  function fill(select, values, placeholder) {
    select.innerHTML = '<option value="">' + placeholder + '</option>';
    values.forEach(function (v) {
      var o = document.createElement('option');
      o.value = v; o.text = v;
      select.appendChild(o);
    });
  }

  /* ---------- 1) เลือกอำเภอ → กรองประเภท ---------- */
  window.onDistrictChange = function () {
    var district = $('district').value;
    fill($('type'), district ? unique(fullData.filter(byDistrict(district)).map(f('type'))) : [], 'เลือกประเภท');
    fill($('hospital'), [], 'เลือกโรงพยาบาล');
  };

  /* ---------- 2) เลือกประเภท → กรองโรงพยาบาล ---------- */
  window.onTypeChange = function () {
    var district = $('district').value;
    var type = $('type').value;
    var list = (district && type)
      ? unique(fullData.filter(function (r) { return r.district === district && r.type === type; }).map(f('hospital')))
      : [];
    fill($('hospital'), list, 'เลือกโรงพยาบาล');
  };

  function unique(arr) { return arr.filter(function (v, i, a) { return v && a.indexOf(v) === i; }); }
  function f(key) { return function (o) { return o[key]; }; }
  function byDistrict(d) { return function (o) { return o.district === d; }; }

  /* ---------- 3) โหลด dropdown ตอนเปิดหน้า ---------- */
  document.addEventListener('DOMContentLoaded', function () {
    // ถ้าล็อกอินค้างอยู่ พาเข้าหน้าของสิทธิ์นั้นเลย
    var saved = Auth.get();
    if (saved && saved.role) {
      window.location.replace(saved.role === 'admin' ? './admin.html' : './hospital.html');
      return;
    }

    API.getOrDemo('getDropdowns', {}, window.DEMO.dropdowns)
      .then(function (data) {
        fullData = data.fullData || [];
        fill($('district'), data.districts || [], 'เลือกอำเภอ');
      })
      .catch(function (err) {
        UI.toast('error', 'โหลดรายชื่อหน่วยงานไม่สำเร็จ', err.message);
      });
  });

  /* ---------- 4) กดปุ่มเข้าสู่ระบบ ---------- */
  $('loginForm').addEventListener('submit', function (e) {
    e.preventDefault();

    var hospital = $('hospital').value;
    var username = $('username').value.trim();
    var accessCode = $('password').value;
    var btn = $('submitBtn');
    var original = btn.innerHTML;

    if (!hospital || !accessCode) {
      UI.toast('warning', 'กรุณากรอกข้อมูล', 'กรุณาเลือกโรงพยาบาลและใส่รหัสผ่านให้ถูกต้อง');
      return;
    }

    btn.disabled = true;
    btn.innerHTML = '<svg class="animate-spin -ml-1 mr-3 h-5 w-5 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg> กำลังเข้าสู่ระบบ...';

    /* ส่งเป็นค่า SHA-256 ไม่ใช่ตัวรหัสเอง — รหัสจึงไม่โผล่บน URL ที่วิ่งไปหา Google
       ฝั่ง Code.gs แปลงค่าในชีตด้วยสูตรเดียวกันแล้วเทียบ จึงไม่ต้องแก้ชีตเลย */
    API.post({
      action: 'openSession',
      hospital: hospital,
      username: username,
      code: Hash.code(accessCode)
    })
      .catch(function (err) {
        // ต่อ API ไม่ได้ → โหมดตัวอย่าง (รหัสผ่าน 1234)
        if (!window.APP_CONFIG.ALLOW_DEMO_FALLBACK) throw err;
        API.demoMode = true;
        UI.showDemoBanner();
        var rec = (window.DEMO.dropdowns.fullData || []).filter(function (r) { return r.hospital === hospital; })[0] || {};
        if (accessCode !== '1234') {
          return { status: 'error', message: 'โหมดตัวอย่าง: รหัสผ่านคือ 1234' };
        }
        return {
          status: 'success',
          role: hospital.indexOf('สสจ') !== -1 ? 'admin' : 'user',
          hospital: hospital,
          district: rec.district || '', hospitalType: rec.type || '',
          typeCode: rec.typeCode || '', typeLabel: rec.type || '', contactName: ''
        };
      })
      .then(function (data) {
        if (data.status !== 'success') {
          UI.toast('error', 'เข้าสู่ระบบไม่สำเร็จ', data.message || 'โรงพยาบาลหรือรหัสผ่านไม่ถูกต้อง');
          btn.innerHTML = original;
          btn.disabled = false;
          return;
        }

        // ถ้า Apps Script ตัวเก่ายังไม่ส่ง อำเภอ/ประเภท กลับมา ให้หยิบจาก
        // รายชื่อที่โหลดไว้ตอนเปิดหน้า (ชีตเดียวกัน) เพื่อให้หน้าถัดไปกรองเกณฑ์ได้
        var rec = fullData.filter(function (r) { return r.hospital === hospital; })[0] || {};

        // สิทธิ์: ยึดค่าจากชีตเป็นหลัก + เผื่อกรณีชื่อหน่วยงานเป็น สสจ. (เหมือนของเดิม)
        /* ถ้าต่อ Apps Script ได้ (มี token) ให้ยึดสิทธิ์ที่เซิร์ฟเวอร์ตัดสินเท่านั้น
           การเดาจากชื่อหน่วยงานใช้เฉพาะโหมดตัวอย่างที่ยังไม่มี token */
        var isAdmin = data.token
          ? data.role === 'admin'
          : (data.role === 'admin' ||
             hospital.indexOf('สสจ') !== -1 ||
             hospital.indexOf('สาธารณสุขจังหวัด') !== -1);

        Auth.set({
          /* กุญแจยืนยันตัวตนกับ Apps Script ทุกคำสั่งหลังจากนี้ */
          token: data.token || '',
          hospital: data.hospital || hospital,
          username: username || data.contactName || data.hospital || hospital,
          contactName: data.contactName || '',
          district: data.district || rec.district || '',
          hospitalType: data.hospitalType || rec.type || '',
          typeCode: data.typeCode || rec.typeCode || '',
          typeLabel: data.typeLabel || data.hospitalType || rec.type || '',
          role: isAdmin ? 'admin' : 'user',
          loginAt: new Date().toISOString()
        });

        Swal.fire({
          icon: 'success',
          title: 'เข้าสู่ระบบสำเร็จ',
          text: isAdmin ? 'กำลังเข้าสู่หน้าผู้ดูแลระบบ (สสจ.)...' : 'กำลังเข้าสู่หน้าโรงพยาบาล...',
          showConfirmButton: false,
          timer: 1400
        }).then(function () {
          window.location.href = isAdmin ? './admin.html' : './hospital.html';
        });
      })
      .catch(function (err) {
        UI.toast('error', 'เกิดข้อผิดพลาด', 'ไม่สามารถเชื่อมต่อกับเซิร์ฟเวอร์ได้: ' + err.message);
        btn.innerHTML = original;
        btn.disabled = false;
      });
  });
})();
</script>
</body></html>
