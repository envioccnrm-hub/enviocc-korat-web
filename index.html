<!-- สคริปต์เชื่อมต่อ API ของ Google Apps Script -->
<script>
    // URL Web App ของคุณ
    const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycby9t6vY3B6lTx8BIGdI1riw0GhTlMnGWVuqQQQDRG7xMo8smqrLOniahIC0QQloI-Ms/exec';
    let globalFullData = []; // ตัวแปรเก็บชุดข้อมูลสัมพันธ์

    // ฟังก์ชันสำหรับเปิด-ปิดการมองเห็นรหัสผ่าน
    function togglePassword() {
        const passwordInput = document.getElementById('password');
        if (passwordInput.type === 'password') {
            passwordInput.type = 'text';
        } else {
            passwordInput.type = 'password';
        }
    }

    // 1. กรองประเภท เมื่อเลือกอำเภอ
    function onDistrictChange() {
        const selectedDistrict = document.getElementById('district').value;
        const typeSelect = document.getElementById('type');
        const hospitalSelect = document.getElementById('hospital');
        
        typeSelect.innerHTML = '<option value="">เลือกประเภท</option>';
        hospitalSelect.innerHTML = '<option value="">เลือกโรงพยาบาล</option>';
        
        if (!selectedDistrict) return;

        const filteredTypes = [...new Set(
            globalFullData
                .filter(item => item.district === selectedDistrict)
                .map(item => item.type)
        )];

        filteredTypes.forEach(t => {
            let option = document.createElement('option');
            option.value = t; option.text = t;
            typeSelect.appendChild(option);
        });
    }

    // 2. กรองโรงพยาบาล เมื่อเลือกประเภท
    function onTypeChange() {
        const selectedDistrict = document.getElementById('district').value;
        const selectedType = document.getElementById('type').value;
        const hospitalSelect = document.getElementById('hospital');
        
        hospitalSelect.innerHTML = '<option value="">เลือกโรงพยาบาล</option>';
        
        if (!selectedType) return;

        const filteredHospitals = globalFullData.filter(
            item => item.district === selectedDistrict && item.type === selectedType
        );

        filteredHospitals.forEach(h => {
            let option = document.createElement('option');
            option.value = h.hospital; option.text = h.hospital;
            hospitalSelect.appendChild(option);
        });
    }

    // 3. จัดการเมื่อกดปุ่ม Submit (เข้าสู่ระบบด้วยโรงพยาบาล + รหัสผ่าน)
    document.getElementById('loginForm').addEventListener('submit', function(e) {
        e.preventDefault();

        const hospitalVal = document.getElementById('hospital').value;
        const usernameVal = document.getElementById('username').value;
        const passwordVal = document.getElementById('password').value;
        const submitBtn = document.getElementById('submitBtn');
        const originalBtnHTML = submitBtn.innerHTML;

        if(!hospitalVal || !passwordVal) {
            Swal.fire({
                icon: 'warning',
                title: 'กรุณากรอกข้อมูล',
                text: 'กรุณาเลือกโรงพยาบาลและใส่รหัสผ่านให้ถูกต้อง',
                confirmButtonColor: '#0059a4'
            });
            return;
        }

        // เปลี่ยนสถานะปุ่มเป็นกำลังโหลด
        submitBtn.innerHTML = '<svg class="animate-spin -ml-1 mr-3 h-5 w-5 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg> กำลังเข้าสู่ระบบ...';
        submitBtn.disabled = true;

        // ดึงข้อมูลผ่าน API โดยส่ง hospital และ password ไปตรวจสอบ
        fetch(SCRIPT_URL + '?action=login', {
            method: 'POST',
            body: JSON.stringify({
                hospital: hospitalVal,
                password: passwordVal
            })
        })
        .then(response => response.json())
        .then(data => {
            if (data.status === 'success') {
// เช็กสิทธิ์ว่าเป็น Admin หรือ สสจ. (ดักทั้งคำว่า สสจ, สาธารณสุขจังหวัด และ username = admin)
                const isAdmin = data.role === 'admin' || 
                                hospitalVal.includes('สสจ') || 
                                hospitalVal.includes('สาธารณสุขจังหวัด') || 
                                usernameVal.trim().toLowerCase() === 'admin';

                localStorage.setItem('currentUser', JSON.stringify({
                    hospital: hospitalVal,
                    username: usernameVal || hospitalVal,
                    role: isAdmin ? 'admin' : 'user'
                }));

                Swal.fire({
                    icon: 'success',
                    title: 'เข้าสู่ระบบสำเร็จ',
                    text: 'กำลังพาท่านเข้าสู่ระบบ...',
                    showConfirmButton: false,
                    timer: 1500
                }).then(() => {
                    if (isAdmin) {
                        window.location.href = 'admin.html';
                    } else {
                        window.location.href = 'hospital.html';
                    }
                });
            } else {
                Swal.fire({
                    icon: 'error',
                    title: 'เข้าสู่ระบบไม่สำเร็จ',
                    text: data.message || 'โรงพยาบาลหรือรหัสผ่านไม่ถูกต้อง',
                    confirmButtonColor: '#0059a4'
                });
                submitBtn.innerHTML = originalBtnHTML;
                submitBtn.disabled = false;
            }
        })
        .catch(error => {
            Swal.fire({
                icon: 'error',
                title: 'เกิดข้อผิดพลาด',
                text: 'ไม่สามารถเชื่อมต่อกับเซิร์ฟเวอร์ได้ กรุณาลองใหม่อีกครั้ง',
                confirmButtonColor: '#0059a4'
            });
            submitBtn.innerHTML = originalBtnHTML;
            submitBtn.disabled = false;
        });
    });

    // 4. โหลดข้อมูล Dropdown เมื่อเปิดหน้าเว็บ
    window.addEventListener('load', function() {
        fetch(SCRIPT_URL + '?action=getDropdowns')
        .then(response => response.json())
        .then(data => {
            const districtSelect = document.getElementById('district');
            
            // เก็บ fullData ไว้ใช้งานทำ Dynamic Filter
            if (data.fullData) {
                globalFullData = data.fullData;
            }

            // เติมข้อมูลเฉพาะอำเภอเริ่มต้นก่อน
            data.districts.forEach(d => {
                let option = document.createElement('option');
                option.value = d; option.text = d;
                districtSelect.appendChild(option);
            });
        })
        .catch(error => console.error('Error:', error));
    });
</script>

</body></html>
